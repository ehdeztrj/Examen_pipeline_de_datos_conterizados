version: '3.8'

services:
  hadoop:
    build: ./hadoop
    container_name: hadoop_node
    # Sobrescribimos el CMD para compartir la llave SSH generada con la API
    command: bash -c "cp /root/.ssh/id_rsa /shared_keys/id_rsa && chmod 600 /shared_keys/id_rsa && service ssh start && tail -f /dev/null"
    volumes:
      # Montaje del CSV como solo lectura (ro) para evitar penalizaciones
      - ./ventas_125054088.csv:/data/input/ventas_125054088.csv:ro
      - ssh_keys:/shared_keys
    networks:
      - datamart_net

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      # Volumen nombrado para persistencia de la base de datos
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - datamart_net

  api:
    build: ./api
    container_name: api_server
    depends_on:
      - db
    volumes:
      # La API monta las llaves de Hadoop para poder hacer 'ssh root@hadoop' sin contraseña
      - ssh_keys:/root/.ssh
    networks:
      - datamart_net
    ports:
      - "8000:8000"

volumes:
  pgdata:
  ssh_keys:

networks:
  datamart_net:
    driver: bridge